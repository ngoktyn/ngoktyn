    text-anchor="middle"
    fill="white"
    font-size="54"
    font-family="Arial"
    font-weight="bold">
    This is Ngoc Tuyen's world.
  </text>

  <!-- chữ nhỏ -->
  <text
    x="50%"
    y="64%"
    text-anchor="middle"
    fill="white"
    font-size="28"
    font-family="Arial">
    Information Security Student
  </text>

</svg>
