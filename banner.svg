<svg width="1200" height="320"
     viewBox="0 0 1200 320"
     xmlns="http://www.w3.org/2000/svg">

  <image
    href="https://raw.githubusercontent.com/ngoktyn/ngoktyn/main/1dcb5717b481eff60a6c826ba721d6c6.jpg"
    width="1200"
    height="320"
    preserveAspectRatio="xMidYMid slice"
  />

  <!-- lớp nền tối nhẹ để chữ dễ nhìn hơn -->
  <rect width="1200" height="320" fill="black" opacity="0.20"/>

  <!-- chữ lớn -->
  <text
